<article class="notes-post">
  <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006.01.02" }}</time>
  <h3><a href="{{ .RelPermalink }}">{{ .Title }}{{ partial "notes/icon.html" "diagonal" }}</a></h3>
  <p>{{ .Description | default (.Summary | plainify | truncate 100) }}</p>
</article>
