<article class="notes-post"><div class="notes-post-top"><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006.01.02" }}</time><div class="notes-tags">{{ range .GetTerms "tags" }}<a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a>{{ end }}</div></div><h3><a href="{{ .RelPermalink }}">{{ .Title }}{{ partial "notes/icon.html" "diagonal" }}</a></h3><p>{{ .Description | default (.Summary | plainify | truncate 100) }}</p><a href="{{ .RelPermalink }}" class="notes-post-read" aria-label="阅读：{{ .Title }}">继续阅读 {{ partial "notes/icon.html" "arrow" }}</a></article>
