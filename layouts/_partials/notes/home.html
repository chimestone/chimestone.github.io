<section class="notes-hero" aria-labelledby="notes-hero-title">
  <h1 id="notes-hero-title" data-reveal>保持好奇，<br>让思考<span class="notes-hero-emphasis">留下痕迹。</span></h1>
  <div class="notes-hero-intro" data-reveal>{{ .Content }}</div>
</section>
<section class="notes-latest" aria-labelledby="notes-latest-title" data-reveal>
  <div class="notes-section-heading"><h2 id="notes-latest-title">最近的笔记</h2><a href="{{ "blog/" | relURL }}">全部文章 {{ partial "notes/icon.html" "arrow" }}</a></div>
  <div class="notes-post-list">{{ range first 5 (where site.RegularPages "Section" "blog").ByDate.Reverse }}{{ partial "notes/post.html" . }}{{ else }}<p class="notes-empty">新的记录正在整理。</p>{{ end }}</div>
</section>
