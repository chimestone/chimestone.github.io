<div class="notes-rail-inner">
  {{ if and .IsPage (ne .Params.toc false) (gt (len .Fragments.Identifiers) 0) }}
    <section class="notes-rail-section notes-outline-section"><p class="notes-rail-caption">本文目录</p><div class="notes-outline">{{ .TableOfContents | replaceRE ` id="TableOfContents"` "" | safeHTML }}</div></section>
    <div class="notes-reading"><div><span>阅读进度</span><output data-reading-label>0%</output></div><div class="notes-reading-track"><div data-reading-bar></div></div><button type="button" data-back-top>回到顶部 <span aria-hidden="true">↑</span></button></div>
  {{ end }}
</div>
