baseURL: "https://chimestone.github.io/"
title: "我的博客"
locale: "zh-cn"
languageCode: "zh-CN"
defaultContentLanguage: "zh-cn"
hasCJKLanguage: true

caches:
  images:
    dir: :cacheDir/images

module:
  imports:
    - path: github.com/imfing/hextra

security:
  http:
    urls: [".*"]

menu:
  main:
    - name: 首页
      pageRef: /
      weight: 1
    - name: 博客
      pageRef: /blog
      weight: 2
    - name: 关于
      pageRef: /about
      weight: 3
    - name: 搜索
      weight: 4
      params:
        type: search

params:
  description: "我的个人博客"
  profile:
    name: "chimestone"
    tagline: "记录学习，整理思考。"
    github: "https://github.com/chimestone"
    avatar: "https://avatars.githubusercontent.com/u/182640298?v=4&size=192"
  dateFormat: "2006年1月2日"
  theme:
    default: dark
    displayToggle: true
  navbar:
    displayTitle: true
    displayLogo: false
